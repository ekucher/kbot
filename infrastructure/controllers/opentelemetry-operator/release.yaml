apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: opentelemetry-operator
  targetNamespace: observability

  dependsOn:
    - name: cert-manager

  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.122.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    admissionWebhooks:
      certManager:
        enabled: true
      autoGenerateCert:
        enabled: false

    crds:
      create: true
