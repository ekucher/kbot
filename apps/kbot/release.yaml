apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kbot
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kbot
  targetNamespace: kbot

  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 1m

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
