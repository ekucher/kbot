apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-collector
  namespace: flux-system
spec:
  interval: 10m

  dependsOn:
    - name: observability-backends

  path: ./observability/collector
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
