apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kbot
  namespace: flux-system
spec:
  interval: 10m

  dependsOn:
    - name: observability-collector

  path: ./apps/kbot
  prune: true
  wait: true
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
