apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-grafana
  namespace: flux-system
spec:
  interval: 10m

  dependsOn:
    - name: observability-backends
    - name: observability-logging

  path: ./observability/grafana
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
