apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  interval: 30m
  releaseName: fluent-bit
  targetNamespace: observability

  chart:
    spec:
      chart: fluent-bit-collector
      version: "1.1.2"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    storage:
      enabled: true

    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

    tolerations:
      - operator: Exists

    config:
      service:
        log_level: info
        http_listen: 0.0.0.0

      pipeline:
        outputs:
          - name: loki
            match: "kube.*"
            host: loki-gateway.observability.svc.cluster.local
            port: 80
            uri: /loki/api/v1/push
            labels: "job=fluent-bit,cluster=k3d-kbot,namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name'],node=$kubernetes['host']"
            line_format: json
